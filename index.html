        1: `SCRIPT TASK 1:\nHost: Welcome, ladies and gentlemen, to another exciting episode of "Earth Talk."...\nGuest: Absolutely. Heritage sites are places of historical, cultural, and natural value...\n(Full script in đề cương)`,
        2: `SCRIPT TASK 2:\nIn the teen years, young people develop and practice skills they will need as adults...\n(Full script as provided)`,
        3: `SCRIPT TASK 3:\nMeet Amber. Amber used to love school, but then she hated going...\n(Full script as provided)`
    };

    let submitted = false;

    function renderQuiz() {
        const form = document.getElementById('quizForm');
        form.innerHTML = '';
        let currentSection = '';
        let passageText = '';

        quizData.forEach((q, index) => {
            if (q.section !== currentSection) {
                currentSection = q.section;
                const secDiv = document.createElement('div');
                secDiv.className = 'section-title';
                secDiv.innerHTML = `<h3>${currentSection}</h3>`;
                form.appendChild(secDiv);
                // Hiển thị passage nếu có
                if (q.passage) {
                    passageText = q.passage;
                    const passDiv = document.createElement('div');
                    passDiv.className = 'passage';
                    passDiv.textContent = passageText;
                    form.appendChild(passDiv);
                } else {
                    passageText = '';
                }
            } else if (q.passage) {
                passageText = q.passage;
                const passDiv = document.createElement('div');
                passDiv.className = 'passage';
                passDiv.textContent = passageText;
                form.appendChild(passDiv);
            }

            const qDiv = document.createElement('div');
            qDiv.className = 'question';
            qDiv.id = `q-${index}`;
            const titleDiv = document.createElement('div');
            titleDiv.className = 'q-title';
            titleDiv.textContent = q.text;
            qDiv.appendChild(titleDiv);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            if (q.type === 'tf') {
                ['True', 'False'].forEach((val, optIndex) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q${index}`;
                    radio.value = val;
                    if (submitted) radio.disabled = true;
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(' ' + val));
                    optionsDiv.appendChild(label);
                });
            } else {
                q.options.forEach((opt, optIndex) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q${index}`;
                    radio.value = optIndex;
                    if (submitted) radio.disabled = true;
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(' ' + opt));
                    optionsDiv.appendChild(label);
                });
            }

            const feedbackDiv = document.createElement('div');
            feedbackDiv.className = 'feedback';
            feedbackDiv.id = `fb-${index}`;
            qDiv.appendChild(optionsDiv);
            qDiv.appendChild(feedbackDiv);
            form.appendChild(qDiv);
        });
    }

    function submitQuiz() {
        if (submitted) return;
        submitted = true;
        let correctCount = 0;
        const total = quizData.length;

        quizData.forEach((q, index) => {
            const name = `q${index}`;
            const selected = document.querySelector(`input[name="${name}"]:checked`);
            const feedbackDiv = document.getElementById(`fb-${index}`);
            const qDiv = document.getElementById(`q-${index}`);

            let userAnswer = null;
            if (q.type === 'tf') {
                userAnswer = selected ? selected.value : null;
            } else {
                userAnswer = selected ? parseInt(selected.value) : null;
            }

            let isCorrect = false;
            if (q.type === 'tf') {
                isCorrect = userAnswer === q.answer;
            } else {
                isCorrect = userAnswer === q.answer;
            }

            if (isCorrect) {
                correctCount++;
                qDiv.classList.add('correct');
                feedbackDiv.textContent = '✓ Chính xác!';
                feedbackDiv.style.color = 'green';
            } else {
                qDiv.classList.add('incorrect');
                let correctDisplay = '';
                if (q.type === 'tf') {
                    correctDisplay = q.answer;
                } else {
                    correctDisplay = q.options[q.answer];
                }
                feedbackDiv.textContent = `✗ Đáp án đúng: ${correctDisplay}`;
                feedbackDiv.style.color = 'red';
            }
            feedbackDiv.classList.add('show');

            // Disable radio buttons
            const radios = document.querySelectorAll(`input[name="${name}"]`);
            radios.forEach(radio => radio.disabled = true);
        });

        const scorePanel = document.getElementById('scorePanel');
        scorePanel.innerHTML = `Điểm của bạn: ${correctCount} / ${total} (${((correctCount/total)*100).toFixed(1)}%)`;
        scorePanel.classList.add('show');
    }

    function resetQuiz() {
        submitted = false;
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.checked = false;
            radio.disabled = false;
        });
        document.querySelectorAll('.question').forEach(qDiv => {
            qDiv.classList.remove('correct', 'incorrect');
        });
        document.querySelectorAll('.feedback').forEach(fb => {
            fb.textContent = '';
            fb.classList.remove('show');
        });
        document.getElementById('scorePanel').classList.remove('show');
    }

    // Toggle script
    let scriptVisible = false;
    document.getElementById('toggleScriptBtn').addEventListener('click', function() {
        const container = document.getElementById('scriptContainer');
        if (!scriptVisible) {
            let html = '';
            for (let key in scripts) {
                html += `<div class="script-box show"><strong>Task ${key}:</strong><br>${scripts[key]}</div>`;
            }
            container.innerHTML = html;
            this.textContent = 'Ẩn Script Listening';
            scriptVisible = true;
        } else {
            container.innerHTML = '';
            this.textContent = 'Hiện Script Listening';
            scriptVisible = false;
        }
    });

    document.getElementById('submitBtn').addEventListener('click', submitQuiz);
    document.getElementById('resetBtn').addEventListener('click', resetQuiz);

    // Khởi tạo
    renderQuiz();
</script>
</body>
</html>
